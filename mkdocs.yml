site_name: Rugby7 Referee Fatigue Analyzer
site_description: Scientific software for analysing fatigue and match demands in Rugby Sevens referees
site_author: SportsLabResearch
site_url: https://sportslabresearch.github.io/Rugby7-Referee-Fatigue-Analyzer/

repo_url: https://github.com/SportsLabResearch/Rugby7-Referee-Fatigue-Analyzer
repo_name: SportsLabResearch/Rugby7-Referee-Fatigue-Analyzer

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy

nav:
  - Home: index.md
  - Installation: installation.md
  - Quick Start: quickstart.md
  - User Guide: user-guide.md
  - Citation: citation.md

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

copyright: Copyright &copy; 2026 SportsLabResearch
